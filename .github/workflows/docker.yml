name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert GitHub owner to lowercase
        id: vars
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: proot-test:local

      - name: Test package installation and persistence as an arbitrary UID
        shell: bash
        run: |
          bash -n entrypoint.sh
          mkdir -p "$RUNNER_TEMP/proot-data"
          chmod 777 "$RUNNER_TEMP/proot-data"
          docker run --rm --read-only --user 12345:12345 --cap-drop ALL \
            --tmpfs /tmp:rw,exec,nosuid,size=256m --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/proot-data:/home/container" proot-test:local \
            /bin/bash -ec 'test "$(id -u)" = 0; node --version; command -v dropbear; apt-get update; apt-get install -y hello; hello'
          docker run --rm --read-only --user 12345:12345 --cap-drop ALL \
            --tmpfs /tmp:rw,exec,nosuid,size=256m --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/proot-data:/home/container" proot-test:local \
            /bin/bash -ec 'dpkg-query -W hello; hello'

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/node24-fariz-fix:latest
